; Auleek Turntable firmware v2
; Build:   pio run
; Flash:   pio run -t upload -t monitor
; Tests:   pio test -e native

[platformio]
default_envs = esp32dev

[env]
test_framework = unity

[env:esp32dev]
platform = espressif32 @ 6.9.0          ; Arduino core 2.0.17
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv ; 2 x 1.9 MB OTA app slots
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DFW_VERSION=\"2.0.0-dev\"
lib_deps =
  waspinator/AccelStepper @ 1.64
  h2zero/NimBLE-Arduino @ ~1.4.3
  bblanchon/ArduinoJson @ ~7.2.0

[env:release]
extends = env:esp32dev
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DFW_VERSION=\"2.0.0\"

[env:native]
platform = native
build_src_filter = -<*>
